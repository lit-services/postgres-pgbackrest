name: build-postgres-pgbackrest

# Baut das Image und pusht nach GHCR (ghcr.io/lit-services/postgres-pgbackrest).
# Wöchentlicher Rebuild zieht automatisch postgres:18-Patches + pgbackrest-Updates.
on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".github/workflows/build.yml"]
  schedule:
    - cron: "0 4 * * 1" # Mo 04:00 UTC
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lit-services/postgres-pgbackrest
  PG_MAJOR: "18"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PG_MAJOR }}
            type=raw,value=latest
            type=sha,prefix=${{ env.PG_MAJOR }}-,format=short

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: PG_MAJOR=${{ env.PG_MAJOR }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
